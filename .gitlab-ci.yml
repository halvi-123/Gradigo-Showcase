# Root GitLab CI pipeline for Django backend only
variables:
  MYSQL_DATABASE: $MYSQL_DB
  MYSQL_ROOT_PASSWORD: $MYSQL_PASS
  MYSQL_USER: $MYSQL_USER
  MYSQL_PASSWORD: $MYSQL_PASS

default:
  image: ubuntu:20.04
  services:
    - mysql:8.0
  cache:
    paths:
      - ~/.cache/pip/
  before_script:
    - apt -y update
    - apt -y install apt-utils net-tools python3.8 python3-pip mysql-client libmysqlclient-dev
    - apt -y upgrade
    - cd Backend
    - pip3 install -r requirements.txt

migrations:
  stage: build
  script:
    - cd Backend
    - python3 manage.py migrate
    - python3 manage.py check

django-tests:
  stage: test
  script:
    - cd Backend
    - echo "GRANT ALL on *.* to '${MYSQL_USER}';" | mysql -u root --password="${MYSQL_ROOT_PASSWORD}" -h mysql
    - python3 manage.py test

deploy:
  stage: deploy
  script:
    - echo "Define your deployment script!"
  environment: production

# Ignore frontend folder
cache:
  paths:
    - Backend/.cache/pip/