services:
  backend:
    build:
      context: ./backend
    container_name: fjn_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Frontend/first-job-navigator
    container_name: fjn_frontend
    restart: unless-stopped
    env_file:
      - ./Frontend/first-job-navigator/.env.production
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MOVE_OUT_USE_MOCK: "false"
      NEXT_PUBLIC_MOVE_OUT_MOCK_SCENARIO: success
      PORT: 3001
    depends_on:
      - backend
    ports:
      - "3001:3001"
    
    